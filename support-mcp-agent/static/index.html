<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP Support Agent</title><style>
:root{font-family:system-ui,Arial;background:#0b1220;color:#eef3ff}*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;padding:20px}.app{width:min(760px,100%);background:#172239;border:1px solid #34435e;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px #0005}header{padding:24px;background:#1c2b47}h1{font-size:24px;margin:0 0 8px}.sub{color:#b9c8e5;font-size:14px}.messages{height:370px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 16px;border-radius:14px;max-width:88%;line-height:1.5;white-space:pre-wrap}.bot{background:#263855;align-self:flex-start}.user{background:#3767cc;align-self:flex-end}.meta{font-size:11px;color:#b7c9e7;margin-top:7px}.examples{padding:0 20px 12px;display:flex;gap:8px;flex-wrap:wrap}.examples button{background:#263855;border:1px solid #52688b;color:#fff;border-radius:20px;padding:8px;cursor:pointer}form{padding:16px;display:flex;gap:10px;border-top:1px solid #34435e}input{flex:1;min-width:0;background:#0b1220;border:1px solid #536587;border-radius:10px;padding:14px;color:#fff;font-size:15px}button.send{background:#4b80ef;color:white;border:0;border-radius:10px;padding:0 22px;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main class="app"><header><h1>🤖 MCP Customer Support Agent</h1><div class="sub">FastAPI · Real MCP tool calls · Open source · Optional Ollama</div></header><section id="messages" class="messages" aria-live="polite"><div class="bubble bot">Hi! Ask about shipping, returns, refunds, or demo order ORD1001. To create a ticket, write “create ticket name@example.com my issue”.</div></section><div class="examples"><button onclick="setText('Where is order ORD1001?')">Track order</button><button onclick="setText('What is your refund policy?')">Refund policy</button><button onclick="setText('Create ticket test@example.com my parcel is damaged')">Create ticket</button></div><form id="form"><input id="msg" placeholder="Ask a customer support question..." required maxlength="1500" aria-label="Your message"><button class="send" id="send">Send</button></form></main><script>
const messages=document.getElementById('messages'),msg=document.getElementById('msg'),send=document.getElementById('send');function setText(s){msg.value=s;msg.focus()}function add(text,cls,meta=''){const div=document.createElement('div');div.className='bubble '+cls;div.textContent=text;if(meta){const small=document.createElement('div');small.className='meta';small.textContent=meta;div.appendChild(small)}messages.appendChild(div);messages.scrollTop=messages.scrollHeight}document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const text=msg.value.trim();if(!text)return;add(text,'user');msg.value='';send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');add(d.answer,'bot',`MCP tool: ${d.tool_used} | Planner: ${d.planner}`)}catch(err){add('Error: '+err.message,'bot')}finally{send.disabled=false;msg.focus()}};
</script></body></html>
